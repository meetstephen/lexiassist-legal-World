name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run on the same branch when a new push comes in
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, byte-compile, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          # Original code uses PEP 701 f-string features → Python 3.12+
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Byte-compile (catches syntax errors)
        run: |
          python -m compileall -q app.py lexi/ tests/

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Smoke tests (imports + render_* wiring)
        run: |
          pytest tests/ -q

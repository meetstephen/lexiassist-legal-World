name: Keep Streamlit App Awake

on:
  schedule:
    # Every 6 hours — lightweight safety net to prevent deep cold sleep.
    # The in-browser JS ping (app.py) handles keep-alive while any user tab
    # is open (fires every 7 min). This workflow is only needed for the case
    # where zero users have the app open for extended periods.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping healthcheck endpoint
        run: |
          URL="${APP_URL}/?healthcheck=1"
          echo "Pinging: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "000" ]; then
            echo "✅ App pinged successfully (or cold-starting)"
          else
            echo "⚠️ Unexpected status $STATUS — app may need attention"
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}

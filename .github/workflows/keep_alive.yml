name: Keep Streamlit App Awake

on:
  schedule:
    # Every 8 minutes — Streamlit Cloud sleeps after ~10 min idle
    - cron: '*/8 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer@22

      - name: Visit app with real browser
        run: |
          cat > ping.js << 'EOF'
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });

            try {
              const page = await browser.newPage();
              await page.setUserAgent('Mozilla/5.0 KeepAliveBot/1.0');

              // Visit the healthcheck endpoint
              const url = process.env.APP_URL + '/?healthcheck=1';
              console.log('Visiting:', url);

              const response = await page.goto(url, {
                waitUntil: 'networkidle2',
                timeout: 90000
              });

              console.log('Status:', response.status());

              // Wait for Streamlit to hydrate
              await new Promise(r => setTimeout(r, 8000));

              const content = await page.content();
              if (content.includes('OK') || content.includes('Streamlit')) {
                console.log('✅ App is alive');
              } else {
                console.log('⚠️ Unexpected response — app may be cold-starting');
              }
            } catch (err) {
              console.error('❌ Error:', err.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          EOF
          node ping.js
        env:
          APP_URL: ${{ secrets.APP_URL }}

name: Keep Supabase project active

on:
  schedule:
    # Run daily to leave margin around Supabase's inactivity window.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Supabase Auth health endpoint
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 60 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            https://muywyqrcogqprziijugl.supabase.co/auth/v1/health
